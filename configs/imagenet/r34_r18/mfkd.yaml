EXPERIMENT:
  NAME: ""
  TAG: "mfkd,res34,res18"
  PROJECT: "imagenet_baselines"
DATASET:
  TYPE: "imagenet"
  NUM_WORKERS: 32
  TEST:
    BATCH_SIZE: 128
DISTILLER:
  TYPE: "MFKD"
  TEACHER: "ResNet34"
  STUDENT: "ResNet18"
SOLVER:
  BATCH_SIZE: 512
  EPOCHS: 100
  LR: 0.2
  LR_DECAY_STAGES: [30, 60, 90]
  LR_DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
  MOMENTUM: 0.9
  TYPE: "SGD"
MFKD:
  CE_WEIGHT: 1.0
  TAU_L: 1.0
  TAU_F: 2.0
  ALPHA: 20.0
  BETA: 1.0
  LAMBDA: 0.5
  WARMUP_EPOCHS: 5
  PROTO_MOMENTUM: 0.99
LOG:
  TENSORBOARD_FREQ: 50
  SAVE_CHECKPOINT_FREQ: 100
  WANDB : False
# python3 tools/train.py --cfg configs/imagenet/r34_r18/mfkd.yaml
